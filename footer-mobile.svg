<svg xmlns="http://www.w3.org/2000/svg" width="420" height="270" viewBox="0 0 420 270" role="img" aria-label="Let us build something that matters"><title>Let us build something that matters</title><style>.t{font-family:'Segoe UI',Arial,sans-serif;fill:#F1F5F8}.m{font-family:Consolas,monospace;fill:#9DAEBB}.g{animation:lit .35s ease-out both}.rotate{animation:rot 30s linear infinite;transform-origin:center;transform-box:fill-box}.blink{animation:blink 1s step-end infinite}@keyframes lit{from{opacity:0}to{opacity:1}}@keyframes rot{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="420" height="270" rx="16" fill="#0C1117"/><rect x="1" y="1" width="418" height="268" rx="15" fill="#0C1117" stroke="#293947"/><text x="22" y="33" class="m" font-size="10" font-weight="600" style="fill:#83D6C4" letter-spacing="1.1">END / NEXT TRANSMISSION</text><text x="21" y="105" class="t" font-size="49" font-weight="750" style="fill:#F1F5F8">LET'S BUILD</text><text x="22" y="147" class="t" font-size="37" font-weight="750" style="fill:#F1F5F8">SOMETHING</text><text x="22" y="190" class="t" font-size="37" font-weight="750" style="fill:#F1F5F8">THAT MATTERS.</text><path d="M22 215L397 215" stroke="#293947" stroke-width="1" fill="none"><animate attributeName="stroke-opacity" values="0.32;1;0.32" dur="3s" begin="0.0s" repeatCount="indefinite"/></path><text x="23" y="246" class="m" font-size="16" font-weight="600" style="fill:#83D6C4">gabriel-mello.com</text></svg>