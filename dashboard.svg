<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 573" width="1200" height="573" role="img" aria-label="Real GitHub stats dashboard for Gabriel Mello"><title>Real GitHub stats dashboard for Gabriel Mello</title><style>
.t{font-family:'Segoe UI',Arial,sans-serif;fill:#F1F5F8}.m{font-family:'IBM Plex Mono',Consolas,monospace;fill:#9DAEBB}
.flash{animation:fl 5s ease-in-out infinite}.bar{animation:enter 1.4s ease-out both;transform-box:fill-box;transform-origin:left center}
