" font-size="11" font-weight="500" style="fill:#83D6C4">FULL STACK</text><circle cx="528.9" cy="165.7" r="5" fill="#83D6C4" opacity="1"/><text x="540.9" y="153.7" class="m" font-size="11" font-weight="500" style="fill:#83D6C4">APPLIED AI</text><circle cx="385.5" cy="511.6" r="5" fill="#83D6C4" opacity="1"/><text x="397.5" y="499.6" class="m" font-size="11" font-weight="500" style="fill:#83D6C4">SYSTEMS</text><line x1="711" y1="90" x2="711" y2="501" stroke="#293947" stroke-width="1"/><text x="751" y="144" class="t" font-size="45" font-weight="750" style="fill:#F1F5F8">ENGINEERING</text><text x="751" y="195" class="t" font-size="57" font-weight="750" style="fill:#F1F5F8">CORE</text><text x="752" y="239" class="t" font-size="17" font-weight="400" style="fill:#9DAEBB">A visual model of how I build.</text><text x="752" y="288" class="m" font-size="15" font-weight="500" style="fill:#83D6C4">01  DESIGN THE SYSTEM</text><text x="752" y="320" class="m" font-size="15" font-weight="500" style="fill:#F1F5F8">02  CONNECT THE LAYERS</text><text x="752" y="352" class="m" font-size="15" font-weight="500" style="fill:#F1F5F8">03  APPLY INTELLIGENCE</text><text x="752" y="384" class="m" font-size="15" font-weight="500" style="fill:#F1F5F8">04  SHIP &amp; OBSERVE</text><line x1="754" y1="421" x2="1146" y2="421" stroke="#293947" stroke-width="1"/><text x="753" y="461" class="m" font-size="14" font-weight="600" style="fill:#9DAEBB">NOT A DEMO. A WORKING SYSTEM.</text><text x="35" y="530" class="m" font-size="11" font-weight="500" style="fill:#6E8796">SOFTWARE / INTELLIGENCE / RELIABILITY</text></svg>