<svg xmlns="http://www.w3.org/2000/svg" width="420" height="522" viewBox="0 0 420 522" role="img" aria-label="Responsive terminal intro to Gabriel Mello"><title>Responsive terminal intro to Gabriel Mello</title><style>.t{font-family:'Segoe UI',Arial,sans-serif;fill:#F1F5F8}.m{font-family:Consolas,monospace;fill:#9DAEBB}.g{animation:lit .35s ease-out both}.rotate{animation:rot 30s linear infinite;transform-origin:center;transform-box:fill-box}.blink{animation:blink 1s step-end infinite}@keyframes lit{from{opacity:0}to{opacity:1}}@keyframes rot{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="420" height="522" rx="16" fill="#0C1117"/><rect x="1" y="1" width="418" height="520" rx="15" fill="#0C1117" stroke="#293947"/><text x="22" y="30" class="m" font-size="10" font-weight="600" style="fill:#83D6C4" letter-spacing="1.1">01 / INITIALIZATION</text><rect x="20" y="48" width="380" height="421" rx="12" fill="#0C1117" stroke="#293947"/><rect x="22" y="50" width="376" height="33" rx="10" fill="#17222C" stroke="#293947"/><text x="210" y="72" class="m" font-size="11" font-weight="400" style="fill:#9DAEBB" text-anchor="middle">~/gm/profile</text><text x="36" y="114" class="m" font-size="14" font-weight="500" style="fill:#83D6C4">$ whoami</text><text x="36" y="137" class="m" font-size="13" font-weight="400" style="fill:#F1F5F8">&gt; Gabriel Mello</text><text x="36" y="187" class="m" font-size="14" font-weight="500" style="fill:#83D6C4">$ expertise</text><text x="36" y="210" class="m" font-size="13" font-weight="400" style="fill:#F1F5F8">&gt; Full Stack · Applied AI</text><text x="36" y="231" class="m" font-size="13" font-weight="400" style="fill:#F1F5F8">&gt; Software Architecture</text><text x="36" y="280" class="m" font-size="14" font-weight="500" style="fill:#83D6C4">$ initialize projects</text><text x="36" y="303" class="m" font-size="13" font-weight="400" style="fill:#F1F5F8">&