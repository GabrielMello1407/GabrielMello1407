ght="500" style="fill:#9DAEBB">React</text><circle cx="60" cy="322" r="3" fill="#6E8796" opacity="1"><animate attributeName="opacity" values="0.4;1;0.4" dur="4.0s" begin="0.8s" repeatCount="indefinite"/></circle><text x="75" y="327" class="m" font-size="15" font-weight="500" style="fill:#9DAEBB">TypeScript</text><circle cx="60" cy="356" r="3" fill="#6E8796" opacity="1"/><text x="75" y="361" class="m" font-size="15" font-weight="500" style="fill:#9DAEBB">Tailwind CSS</text><circle cx="60" cy="390" r="3" fill="#6E8796" opacity="1"/><text x="75" y="395" class="m" font-size="15" font-weight="500" style="fill:#9DAEBB">Angular</text><path d="M313 333 h15" stroke="#83D6C4" stroke-width="1.6"><animate attributeName="stroke-opacity" values="0.32;1;0.32" dur="3s" begin="0.0s" repeatCount="indefinite"/></path><path d="M323 329 l5 4 -5 4" fill="none" stroke="#83D6C4"><animate attributeName="stroke-opacity" values="0.32;1;0.32" dur="4s" begin="0.35s" repeatCount="indefinite"/></path><rect x="319" y="95" width="282" height="341" rx="16" fill="#121B23" stroke="#293947"/><rect x="320" y="96" width="280" height="5" rx="2" fill="#293947" opacity="0.9"/><text x="339" y="139" class="m" font-size="17" font-weight="600" style="fill:#83D6C4">02</text><text x="339" y="179" class="t" font-size="26" font-weight="720" style="fill:#F1F5F8">BACKEND</text><text x="339" y="202" class="m" font-size="11" font-weight="400" style="fill:#6E8796" letter-spacing="1.5">SERVICES</text><line x1="339" y1="224" x2="577" y2="224" stroke="#293947" stroke-width="1"/><circle cx="348" cy="254" r="3" fill="#83D6C4" opacity="1"/><text x="363" y="259" class="m" font-size="15" font-weight="500" style="fill:#F1F5F8">Node.js / Express</text><circle cx="348" cy="288" r="3" fill="#6E8796" opacity="1"/><text x="363" y="293" class="m" font-size="15" font-weight="500" style="fill:#9DAEBB">Python</text><circle cx="348" cy="322" r="3" fill="#6E8796" opacity="1"/><text x="363" y="327" class="m" font-size="15" font-weight="500"