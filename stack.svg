="395" class="m" font-size="15" font-weight="500" style="fill:#9DAEBB">BullMQ</text><path d="M889 333 h15" stroke="#83D6C4" stroke-width="1.6"><animate attributeName="stroke-opacity" values="0.32;1;0.32" dur="4s" begin="1.4s" repeatCount="indefinite"/></path><path d="M899 329 l5 4 -5 4" fill="none" stroke="#83D6C4"/><rect x="895" y="95" width="282" height="341" rx="16" fill="#121B23" stroke="#293947"/><rect x="896" y="96" width="280" height="5" rx="2" fill="#83D6C4" opacity="1"/><text x="915" y="139" class="m" font-size="17" font-weight="600" style="fill:#83D6C4">04</text><text x="915" y="179" class="t" font-size="26" font-weight="720" style="fill:#F1F5F8">AI</text><text x="915" y="202" class="m" font-size="11" font-weight="400" style="fill:#6E8796" letter-spacing="1.5">INTELLIGENCE</text><line x1="915" y1="224" x2="1153" y2="224" stroke="#293947" stroke-width="1"/><circle cx="924" cy="254" r="3" fill="#83D6C4" opacity="1"/><text x="939" y="259" class="m" font-size="15" font-weight="500" style="fill:#F1F5F8">Gemini / Claude</text><circle cx="924" cy="288" r="3" fill="#6E8796" opacity="1"/><text x="939" y="293" class="m" font-size="15" font-weight="500" style="fill:#9DAEBB">LLMs</text><circle cx="924" cy="322" r="3" fill="#6E8796" opacity="1"/><text x="939" y="327" class="m" font-size="15" font-weight="500" style="fill:#9DAEBB">RAG pipelines</text><circle cx="924" cy="356" r="3" fill="#6E8796" opacity="1"/><text x="939" y="361" class="m" font-size="15" font-weight="500" style="fill:#9DAEBB">AI agents</text><circle cx="924" cy="390" r="3" fill="#6E8796" opacity="1"/><text x="939" y="395" class="m" font-size="15" font-weight="500" style="fill:#9DAEBB">Validation loops</text><text x="35" y="468" class="m" font-size="12" font-weight="600" style="fill:#83D6C4" letter-spacing="1">LAYERED, NOT FRAGMENTED.</text><text x="1165" y="468" class="m" font-size="11" font-weight="400" style="fill:#6E8796" text-anchor="end">INTERFACES → SERVICES → SYSTEMS → INTELLIGENCE</text></svg>